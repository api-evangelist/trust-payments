note: >-
  Test vs live is selected by the sitereference: a test sitereference routes requests
  to the test bank; going live means swapping the test sitereference for the live one.
  No live funds move in test mode. Values below are published verbatim by Trust
  Payments and must not be altered.
environments:
  selector: sitereference
  test: Use your assigned TEST sitereference (routes to the test bank).
  live: Swap the test sitereference for your LIVE sitereference.
amount_triggers:
  note: On the test bank the request amount (baseamount, in minor units) drives the simulated outcome.
  values:
    - {amount: '700.00', outcome: Declined response (errorcode 70000)}
    - {amount: '600.10', outcome: Bank System Error (errorcode 60010)}
    - {amount: '10.50', outcome: Safe/authorised value (no simulated error unless the card itself simulates one)}
security_codes:
  - {value: '123', card_types: [VISA, MASTERCARD, DISCOVER]}
  - {value: '1234', card_types: [AMEX]}
