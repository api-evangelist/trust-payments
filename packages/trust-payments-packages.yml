  Trust Payments Webservices API, published under the SecureTrading GitHub
  organisation and mirrored to public package registries. Server-side SDKs (Python,
  PHP) build STPP JSON requests; browser packages back the JavaScript Library
  (ST.js) hosted-fields / payment-card experience.
