aid: trust-payments
url: https://raw.githubusercontent.com/api-evangelist/trust-payments/refs/heads/main/apis.yml
name: Trust Payments
kind: company
description: >-
  Trust Payments is a London-headquartered payment gateway and processor
  (formerly Secure Trading / SecureTrading) operating across the United Kingdom,
  Europe, and the United States. It offers online, in-store point-of-sale,
  unattended, and mobile card acceptance, acquiring, alternative and local payment
  methods, tokenisation, recurring billing, payouts, and 3-D Secure authentication
  through its TRU Connect gateway. The developer surface centres on the Secure
  Trading Payment Platform (STPP) - a server-to-server JSON Webservices API for
  processing (AUTH, ACCOUNTCHECK, REFUND, SUBSCRIPTION, TRANSACTIONUPDATE, and
  TRANSACTIONQUERY), a JWT-authenticated client-side JavaScript Library for
  PCI-reduced hosted card fields, and mobile SDKs, all documented as reference
  articles in the Trust Payments help centre with Python, PHP, ReactJS, and Swift
  libraries published under the SecureTrading GitHub organisation. Trust Payments
  does not publish a downloadable OpenAPI/Swagger definition; production Webservices
  access requires PCI certification, account approval, and credential (key)
  exchange, so the surface is documentation-and-SDK driven rather than open
  self-serve.
