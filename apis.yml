apis:
  - aid: trust-payments:webservices-api
    name: Trust Payments Webservices API
    description: Server-to-server JSON API (the Secure Trading Payment Platform / STPP) for card processing and management on the TRU Connect gateway. Supports request types including AUTH, ACCOUNTCHECK, REFUND, SUBSCRIPTION, TRANSACTIONUPDATE, and TRANSACTIONQUERY. Authenticated with a Webservices API alias (username) and password scoped to a site reference; production use requires PCI certification and credential exchange. No downloadable OpenAPI is published.
    humanURL: https://help.trustpayments.com/hc/en-us/sections/360005821218-Webservices-API
    baseURL: https://webservices.securetrading.net/json/
    tags:
      - Payments
      - Card Payments
      - Processing
      - Acquiring
    properties:
      - type: Documentation
        url: https://help.trustpayments.com/hc/en-us/sections/360005821218-Webservices-API
      - type: APIReference
        url: https://help.trustpayments.com/hc/en-us/articles/11569681677713-Webservices-API-Guide-for-POS-developers
      - type: Documentation
        url: https://help.trustpayments.com/hc/en-us/articles/4402754655761--Install-our-library
  - aid: trust-payments:payouts-api
    name: Trust Payments Payouts API
    description: Payout / disbursement capability exposed through the Webservices API, used to send funds out (for example refunds beyond original transactions and supported payout flows) via the STPP JSON interface on the TRU Connect gateway. Same alias/password + site reference authentication as the core Webservices API.
    humanURL: https://help.trustpayments.com/hc/en-us/articles/4402771924497-Payouts-with-Webservices-API
    baseURL: https://webservices.securetrading.net/json/
    tags:
      - Payouts
      - Disbursements
      - Payments
    properties:
      - type: Documentation
        url: https://help.trustpayments.com/hc/en-us/articles/4402771924497-Payouts-with-Webservices-API
      - type: APIReference
        url: https://help.trustpayments.com/hc/en-us/sections/360005821218-Webservices-API
